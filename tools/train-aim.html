<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aim Model Trainer</title>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; background: #111; color: #ddd; }
  pre { background: #1b1b1b; padding: 8px; white-space: pre-wrap; }
  textarea { width: 100%; height: 160px; background: #1b1b1b; color: #ddd; }
  button { padding: 6px 14px; }
</style>
</head>
<body>
<h1>Aim model trainer</h1>
<p>Simulates people and aimbots, trains the aim classifier and prints <code>src/aimmodel.js</code>. Takes a minute or two.</p>
<button id="go">Train</button>
<pre id="log"></pre>
<textarea id="out" readonly></textarea>
<script type="module">
  import { run } from './train-aim.js';
  const go = document.getElementById('go');
  go.onclick = async () => { go.disabled = true; await run(); go.disabled = false; };
  if (new URLSearchParams(location.search).has('auto')) go.click();
</script>
</body>
</html>
